<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', sans-serif;
  min-height: 100vh;
  background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
  overflow-y: auto;
  padding: 40px 20px;
}

#stars { position: fixed; inset: 0; z-index: 0; }

.nebula {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: .35;
  z-index: 1;
  animation: drift 20s ease-in-out infinite alternate;
  pointer-events: none;
}
.nebula-1 { width: 400px; height: 400px; background: #7b2ff7; top: -100px; left: -100px; }
.nebula-2 { width: 350px; height: 350px; background: #00c6ff; bottom: -80px; right: -80px; animation-delay: -10s; }

@keyframes drift {
  from { transform: translate(0,0) scale(1); }
  to   { transform: translate(60px, 40px) scale(1.15); }
}

.container {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 480px;
  text-align: center;
  color: #fff;
  margin: auto 0;
}

.avatar {
  width: 110px; height: 110px;
  border-radius: 50%;
  margin: 0 auto 16px;
  background: linear-gradient(135deg, #7b2ff7, #00c6ff);
  padding: 3px;
  animation: glow 3s ease-in-out infinite alternate;
}
.avatar img {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #090A0F;
  background: #090A0F;
}
@keyframes glow {
  from { box-shadow: 0 0 15px rgba(123,47,247,.5); }
  to   { box-shadow: 0 0 35px rgba(0,198,255,.8); }
}

h1 { font-size: 1.6rem; margin-bottom: 6px; }
.bio { color: rgba(255,255,255,.7); font-size: .95rem; margin-bottom: 30px; }

.links { display: flex; flex-direction: column; gap: 14px; }
.link {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 20px;
  border-radius: 16px;
  text-decoration: none;
  color: #fff;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.15);
  backdrop-filter: blur(10px);
  transition: all .3s ease;
  position: relative;
  overflow: hidden;
}
.link::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
  transform: translateX(-100%);
  transition: transform .6s;
}
.link:hover::before { transform: translateX(100%); }
.link:hover {
  transform: translateY(-3px) scale(1.02);
  background: rgba(123,47,247,.35);
  border-color: rgba(0,198,255,.6);
  box-shadow: 0 0 25px rgba(123,47,247,.4);
}

.link .icon {
  width: 24px;
  height: 24px;
  fill: #fff;
  flex-shrink: 0;
  transition: fill .3s ease;
}
.link:hover .icon {
  fill: #00c6ff;
}

.link .text { flex: 1; text-align: left; font-weight: 600; font-size: 0.95rem; }

footer { margin-top: 32px; font-size: .8rem; color: rgba(255,255,255,.4); padding-bottom: 20px; }
</style>

<script>
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [], shootingStars = [];

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
window.addEventListener('resize', resize);
resize();

for (let i = 0; i < 200; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.5 + 0.3,
    speed: Math.random() * 0.02 + 0.005,
    alpha: Math.random(),
    dir: Math.random() > 0.5 ? 1 : -1
  });
}

function spawnShootingStar() {
  shootingStars.push({
    x: Math.random() * canvas.width * 0.7,
    y: Math.random() * canvas.height * 0.3,
    len: Math.random() * 80 + 60,
    speed: Math.random() * 6 + 6,
    alpha: 1
  });
}
setInterval(() => { if (Math.random() < 0.5) spawnShootingStar(); }, 2500);

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of stars) {
    s.alpha += s.speed * s.dir;
    if (s.alpha <= 0.1 || s.alpha >= 1) s.dir *= -1;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0.1, Math.min(1, s.alpha))})`;
    ctx.fill();
  }
  shootingStars = shootingStars.filter(m => m.alpha > 0);
  for (const m of shootingStars) {
    const grad = ctx.createLinearGradient(m.x, m.y, m.x + m.len, m.y + m.len * 0.5);
    grad.addColorStop(0, `rgba(255,255,255,${m.alpha})`);
    grad.addColorStop(1, 'transparent');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x + m.len, m.y + m.len * 0.5);
    ctx.stroke();
    m.x += m.speed;
    m.y += m.speed * 0.5;
    m.alpha -= 0.012;
  }
  requestAnimationFrame(draw);
}
draw();
</script>
